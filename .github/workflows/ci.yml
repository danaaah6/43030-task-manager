name: CI Workflow - Docker

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code so later steps can use the project files
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Build a Docker image called task-manager using the Dockerfile
      - name: Build Docker image
        run: docker build -t task-manager:latest .

      # Step 3: Run the container, passing in the GitHub username.
      # --rm removes the container after it finishes.
      - name: Run Docker container
        run: docker run --rm -e GITHUB_USER="${{ github.actor }}" task-manager:latest
